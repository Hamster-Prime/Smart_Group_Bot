[bot]
token_env = "BOT_TOKEN"
parse_mode = "HTML"
drop_pending_updates = true

[bot.main_model]
temperature = 0.7
max_tokens = 2048

[bot.decision_model]
temperature = 0.1
max_tokens = 512

[bot.moderation_model]
temperature = 0.1
max_tokens = 1024

[moderation]
enabled = true
warn_threshold = 3
high_confidence_threshold = 0.9
challenge_timeout_seconds = 600
