[bot]
token_env = "BOT_TOKEN"
parse_mode = "HTML"
drop_pending_updates = true

[bot.main_model]
temperature = 0.7
max_tokens = 2048

[bot.decision_model]
temperature = 0.1
max_tokens = 512

[bot.moderation_model]
temperature = 0.1
max_tokens = 1024

[knowledge]
top_k = 3
similarity_threshold = 0.55
enable_fallback = false
enable_relaxed = false
min_reliable_score = 0.60

[moderation]
enabled = true
warn_threshold = 3
