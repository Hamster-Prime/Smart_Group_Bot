[project]
name = "smart-group-bot"
version = "0.1.0"
description = "Telegram group management + AI chat bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "litellm>=1.50",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "ddgs>=9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]