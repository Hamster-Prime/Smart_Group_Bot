services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      # Legacy one-time import only; ignored after runtime_config is created.
      - ./config.toml:/app/config.toml:ro
    ports:
      # Telegram webhook, settings and verification Mini App.
      - "8480:8480"
    restart: unless-stopped
